<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import Route Planner</title>
<meta name="description" content="Planification d'itinéraires d'importation et mise en relation avec des contacts transitaires en Afrique.">
<style>
  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --text: #111827;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --accent: #111827;
    --accent-hover: #374151;
    --muted: #f3f4f6;
    --success: #059669;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  [data-theme="dark"] {
    --bg: #0c0c0e;
    --surface: #161618;
    --text: #f4f4f5;
    --text-secondary: #a1a1aa;
    --border: #27272a;
    --accent: #f4f4f5;
    --accent-hover: #d4d4d8;
    --muted: #1c1c1f;
    --success: #34d399;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  header {
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  header h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--text-secondary);
    font-size: 0.875rem;
    margin-top: 4px;
  }

  .theme-btn {
    background: none;
    border: 1px solid var(--border);
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .theme-btn:hover {
    border-color: var(--text-secondary);
  }

  .search-box {
    margin-bottom: 40px;
  }

  .search-box label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text);
  }

  .search-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 0.9375rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus {
    border-color: var(--text);
  }

  .search-input::placeholder {
    color: var(--text-secondary);
  }

  .suggestions {
    margin-top: 4px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
    display: none;
  }

  .suggestions.show {
    display: block;
  }

  .suggestions button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    border: none;
    background: none;
    color: var(--text);
    font-size: 0.9375rem;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .suggestions button:last-child {
    border-bottom: none;
  }

  .suggestions button:hover {
    background: var(--muted);
  }

  .error-msg {
    color: #dc2626;
    font-size: 0.8125rem;
    margin-top: 8px;
  }

  .back-link {
    display: inline-block;
    color: var(--text-secondary);
    font-size: 0.875rem;
    text-decoration: none;
    margin-bottom: 24px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  .back-link:hover {
    color: var(--text);
  }

  .country-title {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .country-meta {
    color: var(--text-secondary);
    font-size: 0.875rem;
    margin-bottom: 32px;
  }

  .section-title {
    font-size: 0.8125rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin-bottom: 12px;
    margin-top: 32px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
  }

  .route-path {
    font-weight: 500;
    font-size: 0.9375rem;
    margin-bottom: 6px;
  }

  .route-note {
    font-size: 0.8125rem;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  .tag {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--text-secondary);
    background: var(--muted);
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 4px;
    margin-top: 8px;
  }

  .contact-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .contact-item:last-child {
    border-bottom: none;
  }

  .contact-info {
    flex: 1;
  }

  .contact-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-bottom: 2px;
  }

  .contact-number {
    font-size: 1rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .wa-link {
    display: inline-flex;
    align-items: center;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--success);
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    white-space: nowrap;
  }

  .wa-link:hover {
    border-color: var(--success);
  }

  .empty-state {
    color: var(--text-secondary);
    font-size: 0.875rem;
    padding: 12px 0;
  }

  .disclaimer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .admin-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 0.875rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }

  .admin-form label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 500;
    margin-bottom: 6px;
    margin-top: 16px;
  }

  .admin-form select,
  .admin-form input {
    width: 100%;
    padding: 10px 12px;
    font-size: 0.875rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
  }

  .btn {
    display: inline-block;
    padding: 8px 16px;
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: var(--bg);
    margin-top: 16px;
  }

  .btn:hover {
    background: var(--accent-hover);
  }

  .btn-danger {
    background: transparent;
    color: #dc2626;
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-size: 0.75rem;
    margin-top: 0;
  }

  .btn-danger:hover {
    border-color: #dc2626;
  }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 0.875rem;
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Import Route Planner</h1>
        <p>Itinéraires et contacts transitaires — Afrique</p>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Changer de thème">◐</button>
    </header>

    <main id="main"></main>

    <div class="disclaimer">
      Les itinéraires et contacts présentés sont fournis à titre indicatif. Vérifiez toujours les conditions auprès du transitaire et des autorités compétentes avant toute expédition.<br><br>
      Import Route Planner — Junior GANGNIHESSOU
    </div>
  </div>

  <button class="admin-toggle" id="adminBtn" title="Administration">⚙</button>
  <div id="toast"></div>

<script>
const RAW = `DZ|Algérie|N|Alger|TN,LY,NE,ML,MR,MA
MA|Maroc|N|Rabat|DZ
TN|Tunisie|N|Tunis|DZ,LY
LY|Libye|N|Tripoli|TN,DZ,NE,TD,SD,EG

SD|Soudan|N|Khartoum|EG,LY,TD,CF,SS,ET,ER
MR|Mauritanie|O|Nouakchott|DZ,ML,SN

GN|Guinée|O|Conakry|GW,SN,ML,CI,LR,SL
SL|Sierra Leone|O|Freetown|GN,LR

ML|Mali|O|Bamako|DZ,NE,BF,CI,GN,SN,MR

CV|Cap-Vert|O|Praia|

CM|Cameroun|C|Yaoundé|NG,TD,CF,CG,GQ,GA
CF|République centrafricaine|C|Bangui|TD,SD,SS,CD,CG,CM
GQ|Guinée équatoriale|C|Malabo|CM,GA
GA|Gabon|C|Libreville|GQ,CM,CG
CG|Congo|C|Brazzaville|GA,CM,CF,CD,AO
CD|République démocratique du Congo|C|Kinshasa|CG,CF,SS,UG,RW,BI,TZ,ZM,AO
ST|Sao Tomé-et-Principe|C|São Tomé|
AO|Angola|C|Luanda|NA,ZM,CD,CG
BI|Burundi|E|Gitega|RW,TZ,CD
RW|Rwanda|E|Kigali|UG,TZ,BI,CD
UG|Ouganda|E|Kampala|SS,KE,TZ,RW,CD
KE|Kenya|E|Nairobi|SS,ET,SO,UG,TZ
TZ|Tanzanie|E|Dodoma|KE,UG,RW,BI,CD,ZM,MW,MZ
ET|Éthiopie|E|Addis-Abeba|ER,DJ,SO,KE,SS,SD
ER|Érythrée|E|Asmara|SD,ET,DJ
DJ|Djibouti|E|Djibouti|ER,ET,SO
SO|Somalie|E|Mogadiscio|DJ,ET,KE
SS|Soudan du Sud|E|Djouba|SD,ET,KE,UG,CD,CF
MW|Malawi|E|Lilongwe|TZ,MZ,ZM
MZ|Mozambique|E|Maputo|TZ,MW,ZM,ZW,ZA,SZ
MG|Madagascar|E|Antananarivo|
MU|Maurice|E|Port-Louis|
SC|Seychelles|E|Victoria|
KM|Comores|E|Moroni|
ZM|Zambie|S|Lusaka|CD,TZ,MW,MZ,ZW,NA,AO
ZW|Zimbabwe|S|Harare|ZM,MZ,ZA,BW
BW|Botswana|S|Gaborone|NA,ZA,ZW
NA|Namibie|S|Windhoek|AO,ZM,BW,ZA
ZA|Afrique du Sud|S|Pretoria|NA,BW,ZW,MZ,SZ,LS
SZ|Eswatini|S|Mbabane|ZA,MZ
LS|Lesotho|S|Maseru|ZA`;

const REGIONS = {
  O: "Afrique de l'Ouest",
  C: "Afrique centrale",
  E: "Afrique de l'Est",
  N: "Afrique du Nord",
  S: "Afrique australe"
};

const DEFAULT_ROUTES = [
  { origin: "Chine", transit: ["Sénégal"], destination: "Gambie", modes: ["Maritime", "Routier"], note: "Entrée via Dakar puis acheminement terrestre." },
  { origin: "Chine", transit: [], destination: "Gambie", modes: ["Aérien"], note: "Option aérienne directe." },
  { origin: "Chine", transit: ["Cameroun"], destination: "Tchad", modes: ["Maritime", "Routier"], note: "Port de Douala." },
  { origin: "Chine", transit: ["Bénin"], destination: "Niger", modes: ["Maritime", "Routier"], note: "Port de Cotonou." },
  { origin: "Chine", transit: ["Togo"], destination: "Burkina Faso", modes: ["Maritime", "Routier"], note: "Port de Lomé." },
  { origin: "Chine", transit: ["Côte d'Ivoire"], destination: "Mali", modes: ["Maritime", "Routier"], note: "Via Abidjan ou San-Pédro." },
  { origin: "Chine", transit: ["Kenya"], destination: "Ouganda", modes: ["Maritime", "Routier"], note: "Port de Mombasa." },
  { origin: "Chine", transit: ["Tanzanie"], destination: "Zambie", modes: ["Maritime", "Routier"], note: "Port de Dar es Salaam." },
  { origin: "Chine", transit: ["Sénégal"], destination: "Mauritanie", modes: ["Maritime", "Routier"], note: "Via Dakar, corridor Sénégal-Mauritanie." },
  { origin: "Chine", transit: ["Sénégal"], destination: "Mali", modes: ["Maritime", "Routier"], note: "Corridor ouest via Dakar." },
  { origin: "Chine", transit: ["Côte d'Ivoire"], destination: "Burkina Faso", modes: ["Maritime", "Routier"], note: "Via Abidjan." },
  { origin: "Chine", transit: ["Cameroun"], destination: "République centrafricaine", modes: ["Maritime", "Routier"], note: "Via Douala." },
  { origin: "Chine", transit: ["Congo"], destination: "République démocratique du Congo", modes: ["Maritime", "Routier"], note: "Via Brazzaville." }
];

const DEFAULT_CONTACTS = {
  SN: ["+221753611863"],
  MR: ["+221710603746"],
  GN: ["+8619566834232", "+224627288325"],
  CG: ["+242069228237"],
  CM: ["+237674238544"],
  SL: ["+232674238544"],
  TD: ["+23566632049"]
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.display = "none", 2000);
}

function buildCountries() {
  const map = {};
  RAW.trim().split("\n").forEach(line => {
    const [iso, nom, reg, cap, vois] = line.split("|");
    map[iso] = { iso, nom, region: REGIONS[reg], capitale: cap, voisins: vois ? vois.split(",") : [] };
  });
  Object.values(map).forEach(c => {
    c.voisins.forEach(v => {
      if (map[v] && !map[v].voisins.includes(c.iso)) map[v].voisins.push(c.iso);
    });
  });
  return map;
}

let DB = load("irp_v4", null) || {
  countries: buildCountries(),
  routes: DEFAULT_ROUTES,
  contacts: { ...DEFAULT_CONTACTS }
};

let byIso = DB.countries;
let byName = {};
Object.values(byIso).forEach(c => byName[norm(c.nom)] = c);

function persist() { save("irp_v4", DB); }

function search(q) {
  q = norm(q);
  if (!q) return [];
  const out = [];
  for (const c of Object.values(byIso)) {
    const key = norm(c.nom + " " + c.iso);
    if (key.includes(q)) {
      const score = norm(c.nom).startsWith(q) || c.iso.toLowerCase() === q ? 0 : 1;
      out.push({ score, c });
    }
  }
  return out.sort((a, b) => a.score - b.score || a.c.nom.localeCompare(b.c.nom)).slice(0, 8).map(x => x.c);
}

/**
 * Règles strictes :
 * - Contact direct du pays
 * - Ensuite contacts des pays voisins
 * - Le numéro stocké sous MR n'apparaît QUE pour la Mauritanie
 */
function resolveContacts(iso) {
  const results = [];
  const seen = new Set();

  if (DB.contacts[iso]?.length) {
    DB.contacts[iso].forEach(num => {
      const clean = num.replace(/\D/g, "");
      if (!seen.has(clean)) {
        seen.add(clean);
        results.push({
          number: num,
          label: iso === "MR" ? "Facilitateur Sénégal – Mauritanie" : "Contact local"
        });
      }
    });
  }

  const voisins = byIso[iso]?.voisins || [];
  for (const v of voisins) {
    if (!DB.contacts[v]?.length) continue;
    if (v === "MR") continue; // réservé uniquement à la Mauritanie

    DB.contacts[v].forEach(num => {
      const clean = num.replace(/\D/g, "");
      if (!seen.has(clean)) {
        seen.add(clean);
        results.push({
          number: num,
          label: `Via ${byIso[v]?.nom || v}`
        });
      }
    });
  }

  return results;
}

let view = "home";
let currentIso = null;

function formatPhone(num) {
  return num.replace(/(\+\d{2,3})(\d+)/, (_, ind, rest) => {
    return ind + " " + rest.replace(/(\d{2,3})(?=\d)/g, "$1 ").trim();
  });
}

function waLink(num) {
  return "https://wa.me/" + num.replace(/\D/g, "");
}

function renderHome() {
  return `
    <div class="search-box">
      <label for="q">Pays de destination</label>
      <input class="search-input" id="q" type="text" placeholder="Rechercher un pays…" autocomplete="off" autofocus>
      <div class="suggestions" id="sg"></div>
      <p class="error-msg" id="err"></p>
    </div>
  `;
}

function renderCountry(iso) {
  const c = byIso[iso];
  if (!c) return `<p>Pays introuvable.</p>`;

  const routes = DB.routes.filter(r => norm(r.destination) === norm(c.nom));
  const contacts = resolveContacts(iso);

  let autoHtml = "";
  if (!routes.length && c.voisins.length) {
    const ports = c.voisins
      .map(v => byIso[v])
      .filter(v => v && ["SN","BJ","TG","CI","CM","KE","TZ","CG","GH","NG"].includes(v.iso))
      .slice(0, 3);

    if (ports.length) {
      autoHtml = ports.map(p => `
        <div class="card">
          <div class="route-path">Chine → ${esc(p.nom)} → ${esc(c.nom)}</div>
          <div class="route-note">Point d'entrée potentiel via ${esc(p.nom)}.</div>
          <span class="tag">À vérifier</span>
        </div>
      `).join("");
    }
  }

  const routesHtml = routes.length
    ? routes.map(r => {
        const path = [r.origin, ...(r.transit || []), r.destination].join(" → ");
        return `
          <div class="card">
            <div class="route-path">${esc(path)}</div>
            ${r.note ? `<div class="route-note">${esc(r.note)}</div>` : ""}
            <div>${(r.modes || []).map(m => `<span class="tag">${esc(m)}</span>`).join("")}</div>
          </div>
        `;
      }).join("")
    : (autoHtml || `<p class="empty-state">Aucune route enregistrée pour ce pays.</p>`);

  const contactsHtml = contacts.length
    ? `<div class="card">${contacts.map(ct => `
        <div class="contact-item">
          <div class="contact-info">
            <div class="contact-label">${esc(ct.label)}</div>
            <div class="contact-number">${esc(formatPhone(ct.number))}</div>
          </div>
          <a class="wa-link" href="${waLink(ct.number)}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      `).join("")}</div>`
    : `<p class="empty-state">Aucun contact disponible pour ce pays ni ses voisins.</p>`;

  return `
    <button class="back-link" id="backBtn">← Retour</button>
    <h2 class="country-title">${esc(c.nom)}</h2>
    <p class="country-meta">${esc(c.region)} · ${esc(c.capitale)}</p>

    <div class="section-title">Itinéraires</div>
    ${routesHtml}

    <div class="section-title">Contacts</div>
    ${contactsHtml}
  `;
}

function renderAdmin() {
  const opts = Object.values(byIso)
    .sort((a, b) => a.nom.localeCompare(b.nom))
    .map(c => `<option value="${c.iso}">${esc(c.nom)}</option>`)
    .join("");

  const list = Object.entries(DB.contacts)
    .filter(([, nums]) => nums?.length)
    .map(([iso, nums]) => {
      const c = byIso[iso];
      return `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div>
            <strong style="font-size:0.9rem">${c ? esc(c.nom) : iso}</strong>
            <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:4px">
              ${nums.map(n => esc(n)).join(" · ")}
            </div>
          </div>
          <button class="btn btn-danger" data-del="${iso}">Supprimer</button>
        </div>
      `;
    }).join("") || `<p class="empty-state">Aucun contact.</p>`;

  return `
    <button class="back-link" id="backBtn">← Retour</button>
    <h2 class="country-title" style="font-size:1.25rem">Administration</h2>
    <p class="country-meta">Gestion des numéros par pays</p>

    <div class="card admin-form">
      <label for="a-iso">Pays</label>
      <select id="a-iso"><option value="">Sélectionner…</option>${opts}</select>

      <label for="a-phone">Numéro (indicatif inclus)</label>
      <input type="text" id="a-phone" placeholder="+221 77 000 00 00">

      <button class="btn" id="a-add">Ajouter</button>
      <p class="error-msg" id="a-err"></p>
    </div>

    <div class="section-title">Contacts enregistrés</div>
    ${list}
  `;
}

function render() {
  const el = $("#main");
  if (view === "home") el.innerHTML = renderHome();
  else if (view === "country") el.innerHTML = renderCountry(currentIso);
  else if (view === "admin") el.innerHTML = renderAdmin();
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  if (e.target.id === "backBtn") {
    view = "home";
    currentIso = null;
    render();
    return;
  }

  if (e.target.id === "a-add") {
    const iso = $("#a-iso").value;
    const phone = $("#a-phone").value.trim();
    const err = $("#a-err");
    if (!iso) { err.textContent = "Sélectionnez un pays."; return; }
    if (!phone || phone.replace(/\D/g, "").length < 8) { err.textContent = "Numéro invalide."; return; }
    if (!DB.contacts[iso]) DB.contacts[iso] = [];
    if (DB.contacts[iso].includes(phone)) { err.textContent = "Numéro déjà enregistré."; return; }
    DB.contacts[iso].push(phone);
    persist();
    toast("Ajouté");
    render();
    return;
  }

  const del = e.target.closest("[data-del]");
  if (del) {
    delete DB.contacts[del.dataset.del];
    persist();
    toast("Supprimé");
    render();
  }
});

document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  const q = e.target.value;
  const list = search(q);
  const box = $("#sg");
  const err = $("#err");

  err.textContent = q && !list.length ? "Aucun pays trouvé." : "";

  if (list.length) {
    box.classList.add("show");
    box.innerHTML = list.map(c =>
      `<button type="button" data-iso="${c.iso}">${esc(c.nom)}</button>`
    ).join("");
  } else {
    box.classList.remove("show");
    box.innerHTML = "";
  }
});

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-iso]");
  if (btn) {
    currentIso = btn.dataset.iso;
    view = "country";
    render();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "q") {
    const list = search(e.target.value);
    if (list[0]) {
      currentIso = list[0].iso;
      view = "country";
      render();
    }
  }
});

$("#themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  save("irp_theme", next);
};

$("#adminBtn").onclick = () => {
  view = view === "admin" ? "home" : "admin";
  render();
};

document.documentElement.dataset.theme = load("irp_theme",
  matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
);
render();
</script>
</body>
</html>
